name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Backend — tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      - name: Run tests
        run: npm test

      # Test de bout en bout en vrai navigateur : démarrer, valider et terminer une séance, puis
      # parcourir les onglets athlète/coach SANS aucune erreur JS. Ce parcours est le plus critique de
      # l'app : un bug ici (ex: ReferenceError à la validation) empêche tous les athlètes de s'entraîner,
      # et les tests unitaires ne le voient pas. Le job `deploy` dépend de `test` : s'il échoue, rien
      # n'est déployé.
      - name: Install Chromium (e2e)
        run: npx playwright-core install --with-deps chromium

      - name: Run e2e (parcours critique en navigateur)
        run: npm run e2e

  # Déploiement automatique sur Render après un merge sur main (CI verte uniquement).
  # Évite le « Manual Deploy » : le déploiement auto de Render ne se déclenche pas toujours.
  # Prérequis (une seule fois) : Render > service prime-athl > Settings > Deploy Hook → copier
  # l'URL, puis GitHub > Settings > Secrets and variables > Actions > New secret
  # nommé RENDER_DEPLOY_HOOK_URL. Sans ce secret, le job est ignoré (aucun échec).
  deploy:
    name: Deploy → Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL non défini — déploiement auto ignoré."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Déploiement Render déclenché."

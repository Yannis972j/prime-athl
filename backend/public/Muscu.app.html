  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#0a0a0e;color:#f0f0f2;-webkit-font-smoothing:antialiased;letter-spacing:-0.011em;font-feature-settings:'ss01','cv11';-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}

  ::-webkit-scrollbar{width:0;height:0}

  @keyframes holoText{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  @keyframes celebrationPop{0%{transform:scale(0.85);opacity:0}60%{transform:scale(1.02);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes imgFade{0%{opacity:0;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

<div id="root"></div>
<div id="splash" style="position:fixed;inset:0;background:#0a0a0e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999;transition:opacity 0.4s ease">
  <img src="/logo.svg" alt="Prime Athl" style="width:52px;height:52px;border-radius:16px;object-fit:cover;display:block"/>
  <div style="color:rgba(240,240,242,0.5);font-size:13px;font-family:Inter,system-ui,sans-serif;letter-spacing:0.3px">Chargement…</div>
  <div style="width:120px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden">
    <div id="splash-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#BFA060,#D4B060);border-radius:2px;transition:width 0.4s ease"></div>
  </div>
</div>
<script>
// Splash : animer la barre pendant le chargement des CDN
(function(){
  const bar = document.getElementById('splash-bar');
  let w = 0;
  const t = setInterval(() => { w = Math.min(w + (w < 70 ? 8 : 1), 92); if(bar) bar.style.width = w + '%'; }, 200);
  window.__splashDone = function(){
    clearInterval(t);
    if(bar) bar.style.width = '100%';
    setTimeout(() => {
      const s = document.getElementById('splash');
      if(s){ s.style.opacity = '0'; setTimeout(() => s.remove(), 400); }
    }, 300);
  };
})();
</script>

.page{max-width:760px;margin:0 auto;padding:36px 40px 48px}

.week-title{font-size:16px;font-weight:800;color:#BFA060;letter-spacing:0.4px;text-transform:uppercase}
.week-avg{display:flex;gap:14px;align-items:center}
.week-avg-item{text-align:center}
.week-avg-val{font-size:15px;font-weight:800;color:#18181b}
.week-avg-lbl{font-size:8px;color:#71717a;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}

.day{margin-bottom:24px;page-break-inside:avoid}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

.meal-time{font-size:10px;color:#a1a1aa;margin-left:auto;font-weight:500}

table{width:100%;border-collapse:collapse}
thead tr{background:#f9f9f9}
th{padding:5px 10px;font-size:10px;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:0.3px;text-align:left;border-bottom:1px solid #f0f0f0}
th.r,td.r{text-align:right}

tr.alt{background:#fafafa}
tr.subtotal td{background:#fff7f4;font-weight:700;color:#BFA060;font-size:11px;border-top:1px solid #fbd5c5}
.unit{color:#a1a1aa;font-size:10px;margin-left:2px}
.day-total{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;background:#f9f9f9;border-radius:8px;font-size:11px}

*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;color:#18181b;background:#fff;font-size:11.5px;line-height:1.45}
.page{max-width:760px;margin:0 auto;padding:36px 40px 48px}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #f0f0f0}

.subtitle{font-size:11px;color:#71717a;margin-top:4px}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;background:#eef2ff;border:1px solid #c7d2fe;font-size:10px;font-weight:700;color:#6366f1}
.week-summary{display:flex;gap:10px;margin-bottom:28px;padding:14px 16px;background:linear-gradient(135deg,#eef2ff,#fff);border:1px solid #c7d2fe;border-radius:10px}

.week-macro-lbl{font-size:9px;color:#71717a;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;margin-top:1px}
.week-sep{width:1px;background:#e0e7ff;align-self:stretch;margin:0 2px}
.day{margin-bottom:26px;page-break-inside:avoid}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.day-name{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#18181b;position:relative;padding-left:10px}
.day-name::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:14px;background:#6366f1;border-radius:2px}

tr:last-child td{border-bottom:none}tr.alt{background:#fafafa}.unit{color:#a1a1aa;font-size:10px;margin-left:2px}

.footer-brand{font-size:10px;font-weight:800;color:#6366f1;letter-spacing:0.8px;text-transform:uppercase}
.footer-note{font-size:9.5px;color:#a1a1aa}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title id="pageTitle">Séance partagée — Prime Athl</title>
<meta id="ogTitle" property="og:title" content="Séance partagée — Prime Athl"/>
<meta id="ogDesc" property="og:description" content="Découvre cette séance d'entraînement sur Prime Athl."/>
<meta property="og:type" content="website"/>
<link rel="icon" href="data:,"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#07070e; --bgRaise:#0f0f1c; --border:rgba(255,255,255,0.08);
    --text:#f0eff8; --textDim:rgba(240,239,248,0.6); --textFaint:rgba(240,239,248,0.35);
    --accent:#BFA060; --accentSoft:rgba(191,160,96,0.12); --good:#2CC4A0; --pink:#B85070;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 60px; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:480px;}
  .brand{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; opacity:0.85;}
  .brand-mark{font-weight:800; font-size:15px; letter-spacing:0.5px;}
  .brand-mark span{color:var(--accent);}
  .card{
    background:var(--bgRaise); border:1px solid var(--border); border-radius:22px;
    padding:22px 20px; margin-bottom:16px;
  }
  .date{font-size:11px; color:var(--textFaint); font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px;}
  .name{font-size:26px; font-weight:800; letter-spacing:-0.5px; margin-bottom:16px;}
  .stats{display:flex; gap:20px; margin-bottom:4px; flex-wrap:wrap;}
  .stat-label{font-size:9px; color:var(--textFaint); font-weight:700; text-transform:uppercase; letter-spacing:0.4px;}
  .stat-val{font-size:17px; font-weight:800; margin-top:2px;}
  .stat-val.vol{color:var(--good);}
  .exlist{display:flex; flex-direction:column; gap:10px;}
  .ex-card{background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .ex-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px;}
  .ex-name{font-size:14px; font-weight:700;}
  .ex-muscle{font-size:10px; color:var(--textFaint); flex-shrink:0;}
  .set-row{display:flex; gap:10px; font-size:12px; color:var(--textDim); padding:3px 0;}
  .set-idx{color:var(--textFaint); width:16px; flex-shrink:0;}
  .actions{display:flex; gap:10px; margin-top:20px;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:14px; font-weight:700; font-size:14px;
  }
  .btn-primary{flex:1; height:52px; background:linear-gradient(135deg,#BFA060,#B85070); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary:disabled{opacity:0.5; cursor:default;}
  .footer-note{text-align:center; font-size:11px; color:var(--textFaint); margin-top:20px; line-height:1.6;}
  .footer-note a{color:var(--accent); text-decoration:none; font-weight:700;}
  .state{text-align:center; padding:60px 20px; color:var(--textDim);}
  .state .big{font-size:40px; margin-bottom:14px;}
  .skel{background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.08),rgba(255,255,255,0.04)); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:10px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="brand-mark">PRIME <span>ATHL</span></span></div>
  <div id="content">
    <div class="card">
      <div class="skel" style="height:12px;width:40%;margin-bottom:10px;"></div>
      <div class="skel" style="height:28px;width:70%;margin-bottom:20px;"></div>
      <div class="skel" style="height:60px;width:100%;"></div>
    </div>
  </div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let shareToken=null;

// Un champ cardio (vitesse/inclinaison/durée/distance) est du texte libre venant d'Excel
// ("30'", "4-5", "8"...), pas forcément un nombre pur.
function fixCardioVal(v){
  const n=parseFloat(v);
  if(!isNaN(n)&&Number.isInteger(n)&&n>30000&&n<80000){
    const adj=n>60?n-1:n;
    const d=new Date(Date.UTC(1899,11,31)+adj*86400000);
    return `${d.getUTCDate()}-${d.getUTCMonth()+1}`;
  }
  return String(v||'');
}
function cardioHasVal(v){const s=fixCardioVal(v).trim();return s!==''&&s!=='0';}
function fixCardioDuree(v){return fixCardioVal(v).replace(/['’′ʼ]+\s*$/,'').trim();}

function fmtHoldDuration(secs){
  secs=Math.max(0,Math.round(secs||0));
  if(secs%60===0)return `${secs/60}min`;
  if(secs<60)return `${secs}s`;
  return `${Math.floor(secs/60)}min${String(secs%60).padStart(2,'0')}`;
}

// Deux systèmes de tag coexistent selon l'origine de la séance : ex.groupType+groupId (séances
// live coach, classic/superset/triset/cardio) et ex.style (séances importées Excel / propres à
// l'athlète, CLASSIQUE/SUPERSET/TRISET/ABDOS/CARDIO, groupées par adjacence). exType() les
// unifie — mêmes helpers que le détail de séance in-app (Muscu.html), dupliqués ici car
// share.html est une page statique indépendante.
function exType(e){
  if(e.groupType&&e.groupType!=='classic')return e.groupType;
  const s=(e.style||'').toLowerCase();
  return(s==='superset'||s==='triset'||s==='cardio'||s==='abdos')?s:'classic';
}
function groupExercisesByType(exercises){
  const list=exercises||[];
  const groups=[];
  const byGroupId=new Map();
  const maxItems={superset:2,triset:3,abdos:Infinity};
  list.forEach(e=>{
    const type=exType(e);
    const isComplex=type!=='classic';
    if(isComplex&&e.groupId&&byGroupId.has(e.groupId)){
      byGroupId.get(e.groupId).items.push(e);
      return;
    }
    const prev=groups[groups.length-1];
    const canAdjMerge=isComplex&&type!=='cardio'&&!e.groupId&&prev&&prev.type===type&&!prev.items[0].groupId&&prev.items.length<(maxItems[type]||Infinity);
    if(canAdjMerge){
      prev.items.push(e);
      return;
    }
    const g={type:isComplex?type:'classic',items:[e]};
    if(isComplex&&e.groupId)byGroupId.set(e.groupId,g);
    groups.push(g);
  });
  return groups;
}
const STYLE_LABELS={superset:'SUPERSET',triset:'TRI-SET',abdos:'CIRCUIT ABDOS'};
const STYLE_COLORS={superset:'#5A8AE0',triset:'#A060D0',abdos:'#2CC4A0'};
const STYLE_RGB={superset:[90,138,224],triset:[160,96,208],abdos:[44,196,160]};

function fmtDate(iso){
  try{
    return new Date(iso).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }catch(e){return '';}
}

function renderSession(session){
  const stats=[];
  if(session.totalVolume) stats.push(['Volume', Math.round(session.totalVolume).toLocaleString('fr-FR')+' kg', 'vol']);
  if(session.duration) stats.push(['Durée', session.duration+' min', '']);
  const nEx=(session.exercises||[]).length;
  if(nEx) stats.push(['Exercices', String(nEx), '']);

  const statsHtml=stats.map(([label,val,cls])=>
    `<div><div class="stat-label">${esc(label)}</div><div class="stat-val ${cls}">${esc(val)}</div></div>`
  ).join('');

  const exCardHtml=(ex,num)=>{
    if(exType(ex)==='cardio'&&ex.cardio){
      const c=ex.cardio;
      const pills=[
        ['⚡','Vitesse',cardioHasVal(c.vitesse)?fixCardioVal(c.vitesse)+' km/h':null],
        ['📐','Inclinaison',cardioHasVal(c.inclinaison)?fixCardioVal(c.inclinaison)+'%':null],
        ['⏱','Durée',cardioHasVal(c.duree)?fixCardioDuree(c.duree)+' min':null],
        ['📏','Distance',cardioHasVal(c.distance)?fixCardioVal(c.distance)+' km':null],
      ].filter(([,,v])=>v).map(([icon,,v])=>
        `<span style="font-size:11px;font-weight:700;color:#C89040;background:rgba(200,144,64,0.1);border:1px solid rgba(200,144,64,0.25);padding:3px 9px;border-radius:8px;">${icon} ${esc(v)}</span>`
      ).join('');
      return `<div class="ex-card">
        <div class="ex-head"><span class="ex-name">${num}. ${esc(ex.name)}</span>${ex.muscle?`<span class="ex-muscle">${esc(ex.muscle)}</span>`:''}</div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.4px;color:#C89040;margin-bottom:8px;">CARDIO</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${pills||'<span style="color:var(--textFaint);font-style:italic;font-size:12px;">Pas de détail</span>'}</div>
      </div>`;
    }
    if(ex.holdSeconds>0){
      const rows=(ex.sets||[]).map((s,si)=>
        `<div class="set-row"><span class="set-idx">${si+1}</span><span>${esc(fmtHoldDuration(ex.holdSeconds))} tenues${s.weight>0?` · ${esc(s.weight)} kg`:''}</span></div>`
      ).join('');
      const restH=ex.restSeconds>0?`<div style="font-size:11px;color:var(--textFaint);margin-top:6px;">⏳ Repos : ${esc(ex.restSeconds)}s</div>`:'';
      return `<div class="ex-card">
        <div class="ex-head"><span class="ex-name">${num}. ${esc(ex.name)}</span>${ex.muscle?`<span class="ex-muscle">${esc(ex.muscle)}</span>`:''}</div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.4px;color:#5A8AE0;margin-bottom:8px;">GAINAGE</div>
        ${rows||'<div class="set-row" style="color:var(--textFaint);font-style:italic;">Pas de détail de série</div>'}
        ${restH}
      </div>`;
    }
    const sets=(ex.sets||[]).map((s,si)=>
      `<div class="set-row"><span class="set-idx">${si+1}</span><span>${esc(s.weight||0)} kg × ${esc(s.reps||0)} reps</span></div>`
    ).join('');
    const rest=ex.restSeconds>0?`<div style="font-size:11px;color:var(--textFaint);margin-top:6px;">⏳ Repos : ${esc(ex.restSeconds)}s</div>`:'';
    return `<div class="ex-card">
      <div class="ex-head"><span class="ex-name">${num}. ${esc(ex.name)}</span>${ex.muscle?`<span class="ex-muscle">${esc(ex.muscle)}</span>`:''}</div>
      ${sets||'<div class="set-row" style="color:var(--textFaint);font-style:italic;">Pas de détail de série</div>'}
      ${rest}
    </div>`;
  };

  let exHtmlNum=0;
  const exHtml=groupExercisesByType(session.exercises||[]).map(group=>{
    const label=STYLE_LABELS[group.type];
    const cards=group.items.map((ex,gi)=>{
      exHtmlNum++;
      const card=exCardHtml(ex,exHtmlNum);
      return gi>0?`<div style="display:flex;gap:6px;align-items:flex-start;"><span style="color:${STYLE_COLORS[group.type]};font-size:13px;flex-shrink:0;margin-top:14px;">↳</span><div style="flex:1;">${card}</div></div>`:card;
    }).join('');
    if(!label)return cards;
    return `<div style="border-left:2px solid ${STYLE_COLORS[group.type]}55;padding-left:10px;margin-bottom:2px;">
      <div style="font-size:10px;font-weight:800;letter-spacing:0.5px;color:${STYLE_COLORS[group.type]};margin-bottom:6px;">${esc(label)} · enchaîné sans repos</div>
      <div style="display:flex;flex-direction:column;gap:10px;">${cards}</div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="date">${esc(fmtDate(session.date))}</div>
      <div class="name">${esc(session.name||'Séance')}</div>
      <div class="stats">${statsHtml}</div>
    </div>
    <div class="exlist">${exHtml}</div>
    <div class="actions">
      <button class="btn-primary" id="pdfBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Télécharger en PDF
      </button>
    </div>
    <div class="footer-note">Créé avec <a href="/Muscu.html">Prime Athl</a> — l'appli de coaching sportif</div>
  `;

  document.getElementById('pdfBtn').addEventListener('click', ()=>downloadPDF(session));
}

// iOS Safari ignore souvent le téléchargement automatique déclenché par jsPDF (doc.save) — le
// clic ne se produit jamais et rien ne se passe, sans message d'erreur (c'est le symptôme
// "le PDF n'arrive pas à être téléchargé"). Ouvrir le blob dans un NOUVEL onglet (window.open)
// échoue aussi sur iOS ("Impossible de charger la page") : Safari refuse d'y résoudre un blob:
// créé par une autre page/contexte. La seule méthode fiable est de naviguer dans le MÊME onglet
// vers le blob — Safari affiche alors le PDF dans sa visionneuse intégrée, d'où l'utilisateur
// peut l'enregistrer/partager.
function savePdfCompat(doc,filename){
  const isIOS=/iP(hone|od|ad)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIOS){
    try{location.href=URL.createObjectURL(doc.output('blob'));return;}catch(e){/* on retente via save() ci-dessous */}
  }
  try{doc.save(filename);}catch(e){
    try{location.href=URL.createObjectURL(doc.output('blob'));}catch(e2){alert('Impossible de générer le PDF.');}
  }
}

function downloadPDF(session){
  const {jsPDF}=window.jspdf||{};
  if(!jsPDF){alert('PDF non disponible, réessaie dans un instant.');return;}
  // Best-effort : compte le téléchargement côté serveur, ne bloque jamais la génération du PDF si ça échoue
  if(shareToken){try{fetch('/api/share/'+encodeURIComponent(shareToken)+'/pdf-download',{method:'POST'}).catch(()=>{});}catch(e){}}
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,margin=16;
  let y=20;
  const line=(txt,size=11,bold=false,color=[255,255,255])=>{
    doc.setFontSize(size);doc.setFont('helvetica',bold?'bold':'normal');
    doc.setTextColor(...color);doc.text(txt,margin,y);y+=size*0.45+2;
  };
  const rule=()=>{doc.setDrawColor(30,30,30);doc.line(margin,y,W-margin,y);y+=4;};
  const newPage=()=>{doc.addPage();doc.setFillColor(14,14,20);doc.rect(0,0,W,297,'F');y=20;};

  doc.setFillColor(14,14,20);doc.rect(0,0,W,297,'F');
  doc.setFontSize(20);doc.setFont('helvetica','bold');
  doc.setTextColor(191,160,96);doc.text(session.name||'Séance',margin,y);y+=10;

  line(fmtDate(session.date),10,false,[140,140,160]);y+=2;rule();

  const stats=[];
  if(session.totalVolume) stats.push(`Volume : ${Math.round(session.totalVolume).toLocaleString('fr-FR')} kg`);
  if(session.duration) stats.push(`Durée : ${session.duration} min`);
  if(stats.length){doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(180,180,200);doc.text(stats.join('   ·   '),margin,y);y+=8;}
  rule();

  let pdfExNum=0;
  groupExercisesByType(session.exercises||[]).forEach(group=>{
    if(STYLE_LABELS[group.type]){
      if(y>265) newPage();
      doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.setTextColor(...STYLE_RGB[group.type]);
      doc.text(`⛓ ${STYLE_LABELS[group.type]} · enchaîné sans repos`,margin,y);y+=6;
    }
    group.items.forEach((ex,gi)=>{
    pdfExNum++;
    if(y>265) newPage();
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(191,160,96);
    doc.text(`${gi>0?'↳ ':''}${pdfExNum}. ${ex.name}`,margin,y);
    if(ex.muscle){doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(120,120,140);doc.text(ex.muscle,W-margin,y,{align:'right'});}
    y+=7;
    if(exType(ex)==='cardio'&&ex.cardio){
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(200,144,64);
      doc.text('CARDIO',margin,y);y+=5.5;
      const c=ex.cardio;
      const parts=[];
      if(cardioHasVal(c.vitesse))parts.push(`Vitesse : ${fixCardioVal(c.vitesse)} km/h`);
      if(cardioHasVal(c.inclinaison))parts.push(`Inclinaison : ${fixCardioVal(c.inclinaison)}%`);
      if(cardioHasVal(c.duree))parts.push(`Durée : ${fixCardioDuree(c.duree)} min`);
      if(cardioHasVal(c.distance))parts.push(`Distance : ${fixCardioVal(c.distance)} km`);
      doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(220,220,230);
      doc.text(parts.length?parts.join('   ·   '):'—',margin,y);y+=8;
      return;
    }
    if(ex.holdSeconds>0){
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(90,138,224);
      doc.text('GAINAGE',margin,y);y+=5.5;
      const nSets=(ex.sets||[]).length||1;
      doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(220,220,230);
      doc.text(`${nSets} série${nSets>1?'s':''} × ${fmtHoldDuration(ex.holdSeconds)} tenues`,margin,y);y+=7;
      if(ex.restSeconds>0){
        doc.setFontSize(8);doc.setFont('helvetica','italic');doc.setTextColor(140,140,160);
        doc.text(`Repos : ${ex.restSeconds}s`,margin,y);y+=5;
      }
      y+=3;
      return;
    }
    const cols=[margin,margin+12,margin+38,margin+64];
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(100,100,120);
    ['#','Poids','Reps','Volume'].forEach((h,i)=>doc.text(h,cols[i],y));y+=5;
    doc.setDrawColor(40,40,55);doc.line(margin,y-1,W-margin,y-1);
    (ex.sets||[]).forEach((s,si)=>{
      if(y>270) newPage();
      const vol=(s.weight||0)*(s.reps||0);
      doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(220,220,230);
      doc.text(String(si+1),cols[0],y);
      doc.text(`${s.weight||0} kg`,cols[1],y);
      doc.text(`${s.reps||0} reps`,cols[2],y);
      doc.text(`${vol} kg`,cols[3],y);
      y+=5.5;
    });
    if(ex.restSeconds>0){
      if(y>270) newPage();
      doc.setFontSize(8);doc.setFont('helvetica','italic');doc.setTextColor(140,140,160);
      doc.text(`Repos : ${ex.restSeconds}s`,cols[0],y);y+=5;
    }
    y+=4;
    });
  });

  doc.setFontSize(8);doc.setTextColor(60,60,80);doc.text('Prime Athl',W/2,290,{align:'center'});

  const d=new Date(session.date);
  const dateSlug=isNaN(d)?'':'-'+d.toISOString().slice(0,10);
  savePdfCompat(doc,`seance-${(session.name||'session').replace(/\s+/g,'-').toLowerCase()}${dateSlug}.pdf`);
}

function renderError(msg){
  document.getElementById('content').innerHTML = `
    <div class="state">
      <div class="big">🔗</div>
      <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">${esc(msg)}</div>
      <div style="font-size:13px;">Ce lien n'est plus disponible ou n'existe pas.</div>
    </div>`;
}

(function init(){
  const token=new URLSearchParams(location.search).get('t');
  if(!token){renderError('Lien invalide');return;}
  shareToken=token;
  fetch('/api/share/'+encodeURIComponent(token))
    .then(r=>{if(!r.ok)throw new Error('not_found');return r.json();})
    .then(data=>{
      const session=data.session;
      document.getElementById('pageTitle').textContent=(session.name||'Séance')+' — Prime Athl';
      document.getElementById('ogTitle').setAttribute('content',(session.name||'Séance')+' — Prime Athl');
      const nEx=(session.exercises||[]).length;
      document.getElementById('ogDesc').setAttribute('content',`${nEx} exercice${nEx>1?'s':''}${session.totalVolume?' · '+Math.round(session.totalVolume).toLocaleString('fr-FR')+' kg':''} — séance suivie sur Prime Athl.`);
      renderSession(session);
    })
    .catch(()=>renderError('Séance introuvable'));
})();
</script>
</body>
</html>
